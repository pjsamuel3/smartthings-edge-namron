name: namron-edge-thermostat
components:
  - id: main
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
        config:
          values:
            - key: "heatingSetpoint.value"
              range: [5, 35]
              step: 0.5
      - id: thermostatMode
        version: 1
      - id: thermostatOperatingState
        version: 1
        config:
          values:
            - key: "thermostatOperatingState.value"
              enabledValues:
                - heating
                - idle
      - id: relativeHumidityMeasurement
        version: 1
      - id: powerMeter
        version: 1
      - id: energyMeter
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Thermostat
preferences:
  - name: sensorMode
    title: "Sensor mode"
    description: "Which sensor controls the heating. Regulator = fixed duty cycle (no sensor)."
    required: false
    preferenceType: enumeration
    definition:
      options:
        "0": "Air (built-in sensor)"
        "1": "Floor sensor"
        "2": "Air, floor as limiter"
        "3": "External sensor"
        "4": "External, floor as limiter"
        "5": "Floor sensor (percent)"
        "6": "Regulator (duty cycle %)"
      default: "1"
  - name: tempCalibration
    title: "Temperature calibration (°C)"
    description: "Offset added to the measured temperature, -3.0 to +3.0"
    required: false
    preferenceType: number
    definition:
      minimum: -3
      maximum: 3
      default: 0
  - name: childLock
    title: "Child lock"
    description: "Lock the buttons on the thermostat"
    required: false
    preferenceType: boolean
    definition:
      default: false
  - name: windowDetection
    title: "Open window detection"
    description: "Pause heating when a sudden temperature drop is detected"
    required: false
    preferenceType: boolean
    definition:
      default: false
  - name: panelBrightness
    title: "Display brightness (%)"
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 100
      default: 50
  - name: screenOnTime
    title: "Display timeout"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "0": "Always on"
        "1": "10 seconds"
        "2": "30 seconds"
        "3": "60 seconds"
      default: "1"
  - name: regulatorPercent
    title: "Regulator output (%)"
    description: "Duty cycle used when sensor mode is Regulator"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 100
      default: 50
  - name: maxHeatTemp
    title: "Maximum setpoint (°C)"
    description: "Upper limit for the heating setpoint"
    required: false
    preferenceType: integer
    definition:
      minimum: 15
      maximum: 35
      default: 35
  - name: autoTimeSync
    title: "Sync clock from hub"
    description: "Keep the thermostat's clock (used by its weekly schedule) in sync with the hub"
    required: false
    preferenceType: boolean
    definition:
      default: true
  - name: utcOffset
    title: "Time zone (hours from UTC)"
    description: "Your standard (winter) time offset from UTC, e.g. 1 for Norway, Sweden and Denmark, 2 for Finland, 0 for the UK. Leave 'Auto Daylight Saving' on at the thermostat; it adds the summer hour itself."
    required: false
    preferenceType: number
    definition:
      minimum: -12
      maximum: 14
      default: 1
