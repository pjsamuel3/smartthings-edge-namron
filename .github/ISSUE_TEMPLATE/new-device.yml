name: New device support
description: Ask for (or help add) support for a Namron Zigbee device
labels: [new-device]
body:
  - type: input
    id: model
    attributes:
      label: Device name and Namron item number
      placeholder: "Namron Zigbee Edge Termostat, 4512783"
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Manufacturer and model as shown in SmartThings
      description: my.smartthings.com → Advanced → Devices → your device
      placeholder: "Manufacturer: Namron AS, Model: 4512783"
    validations:
      required: true
  - type: textarea
    id: clusters
    attributes:
      label: Zigbee clusters (if known)
      description: From the device page, logcat, or a Zigbee2MQTT device page
  - type: textarea
    id: expected
    attributes:
      label: What should work that doesn't today?
    validations:
      required: true
