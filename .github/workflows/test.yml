name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.3 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.3 lua-check
      - name: Lint and run driver tests
        run: ./scripts/test.sh
